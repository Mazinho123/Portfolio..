<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="An interactive, retro handheld-style developer portfolio.">
  <meta name="theme-color" content="#14161f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand" id="brand">PORTFOLIO</span>
    <nav class="topnav">
      <button id="btn-mute" class="chip" type="button">SOUND: ON</button>
      <button id="btn-quick" class="chip" type="button">QUICK VIEW</button>
    </nav>
  </header>

  <main id="game-view">
    <div class="console" id="console">
      <div class="pad-left">
        <div class="dpad">
          <button class="dp up" data-key="up" type="button" aria-label="Up"></button>
          <button class="dp left" data-key="left" type="button" aria-label="Left"></button>
          <span class="dp mid"></span>
          <button class="dp right" data-key="right" type="button" aria-label="Right"></button>
          <button class="dp down" data-key="down" type="button" aria-label="Down"></button>
        </div>
      </div>

      <div class="screen-bezel">
        <div class="bezel-top"><span class="led"></span><span>CODE ORB LAB</span></div>
        <div class="screen-holder" id="screen-holder">
          <div id="screen" aria-live="polite"></div>
        </div>
      </div>

      <div class="pad-right">
        <div class="ab">
          <button class="btn-b" data-key="b" type="button" aria-label="B button (back)">B</button>
          <button class="btn-a" data-key="a" type="button" aria-label="A button (confirm)">A</button>
        </div>
      </div>

      <div class="pad-bottom">
        <button class="pill" data-key="select" type="button" aria-label="Select (about the professor)">SELECT</button>
        <button class="pill" data-key="start" type="button" aria-label="Start">START</button>
      </div>
    </div>

    <p class="help">
      <kbd>&larr;&uarr;&rarr;&darr;</kbd> move &nbsp; <kbd>Z</kbd>/<kbd>Enter</kbd> A &nbsp; <kbd>X</kbd>/<kbd>Esc</kbd> B
      &nbsp; <kbd>Shift</kbd> select &nbsp; <kbd>M</kbd> mute &nbsp;·&nbsp; or just click / tap
    </p>
  </main>

  <section id="quick-view" hidden></section>

  <noscript>
    <p class="noscript">This portfolio is a small game and needs JavaScript. Please enable it to explore.</p>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
